apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: activescale-hpa
  namespace: ns-observability
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: activescale
  minReplicas: 2
  maxReplicas: 50
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 100
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 100
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 500
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 180
      policies:
        - type: Percent
          value: 30
          periodSeconds: 30
      selectPolicy: Max
