apiVersion: apps/v1
kind: Deployment
metadata:
  name: activescale
  namespace: ns-observability
  labels:
    thinq.service: activescale
    app: activescale
    workload: metrics-adapter
spec:
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: activescale
      workload: metrics-adapter
  template:
    metadata:
      annotations:
        activescale.thinq.io/image-refreshed-at: "1970-01-01T09:00:00+09:00"
      labels:
        thinq.service: activescale
        app: activescale
        workload: metrics-adapter
        sidecar.istio.io/inject: "false"
        tcn.kyverno/exception: "true"
    spec:
      serviceAccountName: activescale
      priorityClassName: tcn-hpa-critical
      nodeSelector:
        nodepool: np-cluster-arm64
      containers:
        - name: activescale
          image: ghcr.io/anyflow/activescale:latest
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          args:
            - --secure-port=6443
            - --cert-dir=/var/run/serving-cert
            - --tls-cert-file=/var/run/serving-cert/tls.crt
            - --tls-private-key-file=/var/run/serving-cert/tls.key
          envFrom:
            - configMapRef:
                name: activescale-config
          ports:
            - name: https
              containerPort: 6443
            - name: envoy-grpc
              containerPort: 9000
            - name: health
              containerPort: 18080
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: serving-cert
              mountPath: /var/run/serving-cert
      volumes:
        - name: serving-cert
          secret:
            secretName: activescale-serving-cert
