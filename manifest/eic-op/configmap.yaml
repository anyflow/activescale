apiVersion: v1
kind: ConfigMap
metadata:
  name: activescale-config
  namespace: ns-observability
data:
  REDIS_ADDR: "rediscluster-eu1-op-t20-cm.eefaok.clustercfg.euw1.cache.amazonaws.com:6379"
  # ElastiCache cluster endpoint without in-transit encryption (non-TLS).
  # If in-transit encryption is enabled, set this back to "true" and provide CA via REDIS_CA_FILE.
  REDIS_TLS: "false"
