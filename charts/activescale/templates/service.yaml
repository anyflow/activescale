apiVersion: v1
kind: Service
metadata:
  name: {{ include "activescale.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "activescale.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  selector:
    app.kubernetes.io/name: {{ include "activescale.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: https
      port: 443
      targetPort: https
    - name: envoy-grpc
      port: {{ .Values.grpc.port }}
      targetPort: envoy-grpc
