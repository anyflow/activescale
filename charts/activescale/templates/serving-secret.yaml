{{- if .Values.serving.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.serving.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "activescale.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ required "serving.tlsCrt is required when serving.createSecret is true" .Values.serving.tlsCrt | b64enc | quote }}
  tls.key: {{ required "serving.tlsKey is required when serving.createSecret is true" .Values.serving.tlsKey | b64enc | quote }}
{{- end }}
